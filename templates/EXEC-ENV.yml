# EXEC-ENV.yml — pointer to the project's existing development test runner.
#
# Copy this file to `.release-planning/EXEC-ENV.yml` only when tests need a prefix. With no file,
# `/release:*` runs commands directly on the host. The SDK never starts, recreates or tears down
# Docker containers, databases, Redis instances, Compose projects or any other test environment.
#
# The runner must already exist and must test the current checkout — the same checkout mounted by
# the development setup. Keep lifecycle outside this contract. Keys such as `test_env_provision`,
# `test_env_teardown` and `test_env_migrate`, plus phase-local EXEC-ENV files, are rejected by the
# active workflows.
#
# Format: one `key: value` per line. The parser splits on the first colon. Commands stay plain in
# PLAN/VERIFY-GATE; `/release:*` prepends `test_exec_prefix` to each test invocation.
#
# Example (adapt service/file names to the project's existing dev setup):
# test_harness: external
# test_exec_prefix: docker compose -f {root}/.devcontainer/docker-compose.yml exec -T backend
# test_timeout: 900
