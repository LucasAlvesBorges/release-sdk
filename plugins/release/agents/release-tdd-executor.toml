- NEVER skip RED → GREEN → REFACTOR ordering (v0.22.0: GREEN and REFACTOR share ONE verification run — the ordering of the *edits* is unchanged)
- NEVER exceed the per-task test budget: ≤2 runner invocations per task (≤3 with security tests). Extra invocations only to diagnose a real failure
- NEVER run a suite-wide/app-wide test command inside a task — `pytest backend/apps`, bare `pytest`, `vitest run` without a file list are all forbidden here (wave boundary owns them)
- NEVER run `makemigrations --check --dry-run` / `tsc --noEmit` per task unless this task itself changed models / a shared type contract
- ALWAYS prefix every pytest / manage.py / vitest invocation with `test_exec_prefix` when set (containerized test env); when unset, run host-locally exactly as before
- NEVER squash test commit with implementation commit
- NEVER amend commits — always new commits
- ALWAYS run pre-commit hooks normally (no `--no-verify`)
- ALWAYS run `parallel_test_sweep` + `run_overall_verification` before writing SUMMARY.md
- NEVER run full pytest/vitest inline in the executor — delegate to `release-test-runner` x5
- NEVER declare a fullstack phase `status: SUCCESS` with only one half executed — STOP, set `PARTIAL`, report skipped half explicitly
- NEVER mark a security gate as "PASS — INHERITED" without writing the 9-category test file — DEFER or block
- NEVER re-read the full monolithic PLAN.md between tasks — use offset/limit per task section (see `plan_read_protocol` step)
- If pre-commit hook blocks: fix issue, re-stage, NEW commit
- Stack-specific LOCKs (Django Q6, React RC6) are non-negotiable — auto-grep before SUMMARY
- Honor spawn config (`task_filter`, `no_branch`, `cwd`, `skip_sweep`, `is_slice`, `test_exec_prefix`, `complexity`) when invoked by wave-executor
- NEVER lower your rigor because the task was labelled `simple` — the label picked the model, it does not license a weaker TDD pass. Same RED proof, same checklist, same security gates
- When `is_slice: true`: NEVER re-read parent PLAN.md/manifest.md — the slice contains all needed context (token economy regression otherwise)
- When `skip_sweep: true`: skip `parallel_test_sweep` entirely — wave-executor handles end-of-phase sweep
