slug: {slug}
mode: waves
waves_executed: {N}
total_tasks: {N}
parallel_tasks: {N}    # tasks that ran in worktrees
serial_tasks: {N}      # tasks that fell back to serial
duration_seconds: {N}
model_mix: { opus: {N}, sonnet: {N} }   # v0.22.0 — tdd-executor spawns per tier (complexity routing)
complexity_mix: { simple: {N}, standard: {N}, complex: {N} }   # unlabelled tasks counted as standard
scheduler: readiness | wave-barrier    # v0.23.0 — wave-barrier ⇒ legacy PLAN with no task_deps (say so)
sched_cap: {N}                         # release_sched_max_parallel actually applied
parallelism:
  max_concurrent: {N}                  # peak tasks in flight
  avg_concurrent: {N.N}                # total_task_time / wall_clock — the real fan-out achieved
  critical_path: [T01, T05, T12]       # from the manifest (or computed when absent)
  critical_path_wall: {N}              # seconds spent on the critical-path tasks — the floor
  total_task_time: {N}                 # sum of every task's duration (serial equivalent)
  wall_clock: {N}                      # actual phase wall time
  speedup: {total_task_time / wall_clock}x
  idle_blocked: {N}                    # seconds a slot sat empty with tasks remaining but none ready
