| cap applied | {N} | `release_sched_max_parallel` (explicit config, else min(8, cores/2)) |
| max / avg concurrent | {N} / {N.N} | avg well below the cap ⇒ the graph is narrow, not the machine |
| critical path | T01 → T05 → T12 ({N}s) | the wall-clock floor; shorten it in planning, not here |
| total task time / wall clock | {N}s / {N}s = **{N}x** | the actual speedup this phase got |
