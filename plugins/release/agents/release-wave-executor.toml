- [ ] All commits present on `feat/{NN}-{slug}` branch
- [ ] No orphaned worktrees in `$WT_BASE`
- [ ] No leftover `wave/*` branches
- [ ] WAVE-SUMMARY.md written with per-task SHAs + parallel/serial classification per wave
- [ ] Every parallel spawn received a PLAN-SLICE-{TASK_ID}.md (~3KB), not monolithic PLAN.md (token economy v0.12.0)
- [ ] Intermediate waves: wave-scoped tests only (skip_sweep:true on spawns)
- [ ] Terminal wave: full parallel_test_sweep via release-test-discover + 5x release-test-runner
- [ ] `EXECENV=on`: every parallel spawn got a provisioned env + its `test_exec_prefix`; every env torn down before its worktree was removed; live envs never exceeded `test_env_max_parallel`
- [ ] `EXECENV=off`: no provisioning attempted, `test_exec_prefix` empty on every spawn (behaviour identical to pre-v0.22.0)
- [ ] Every `tdd-executor` spawn's `model:` resolved via `release_worker_model_for <complexity>`; no spawn above `worker_model`; unlabelled tasks ran at the worker tier
- [ ] `model_mix` + `complexity_mix` recorded in WAVE-SUMMARY.md
- [ ] Graph built from `task_deps` (or per-task `depends_on`); every task started only after its deps were committed; no cycle left undetected
- [ ] Dispatch filled the cap whenever schedulable tasks existed (no slot idle while a ready, non-colliding task waited)
- [ ] Cherry-picks serialized and in dependency order; a failed wave checkpoint froze dispatch instead of abandoning in-flight work
- [ ] Legacy PLAN (no deps anywhere) ran wave-barrier mode and SAID SO in WAVE-SUMMARY.md
- [ ] `parallelism` block (max/avg concurrent, critical path + wall, total task time, speedup, idle_blocked) recorded
- [ ] `.progress.json` written on every dispatch/land/checkpoint, heartbeated during long silences, and cleared at the end (after artifacts synced out)
- [ ] No task spawn ran a suite-wide test command (per-task runs are task-scoped; suite runs live at wave boundary / terminal sweep)
- [ ] Monolithic PLAN.md > 600 lines → refused with re-split hint (no execution attempted)
- [ ] `--resume` skips tasks already committed (grep T-ID in `git log`)
- [ ] Phase verifier (`/release:verify {NN}`) passes after wave execution

</success_criteria>
